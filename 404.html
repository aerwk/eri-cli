<!doctype html>
<html lang="en" class="home-html">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/logo-n5.svg" type="image/svg+xml">
  <title>N5HQ</title>
  <script>
    try {
      const s = localStorage.getItem('n5hq-theme');
      if (s === 'light' || (!s && matchMedia('(prefers-color-scheme: light)').matches)) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="/assets/css/style.css?v=1.3.1">
</head>
<body>
  <header class="site-header">
    <a class="site-logo" href="/" aria-label="N5HQ" style="--logo-size: clamp(64px, 5vw, 84px);"><img src="/assets/img/logo-n5.svg" alt="" width="84" height="84"></a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="mailto:helloworld@n5hq.me">EMAIL</a>
    </nav>
  </header>

  <main>
    <section class="page" aria-labelledby="home-title">
      <div class="region">
        <h1 class="headline" id="home-title">N5HQ</h1>
        <p class="page-link"><a href="/">Back to N5HQ</a></p>
      </div>
    </section>
  </main>
</body>
</html>
