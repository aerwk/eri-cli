<!doctype html>
<html lang="en" class="home-html">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="N5HQ">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="assets/img/favicon.png" type="image/png">
  <title>N5HQ</title>
  <link rel="preload" href="./assets/js/three.min.js" as="script" media="(min-width: 821px)">
  <link rel="preload" href="./assets/js/terrain.js" as="script" media="(min-width: 821px)">
  <script>
    (() => {
      try {
        const s = localStorage.getItem('n5hq-theme');
        const p = matchMedia('(prefers-color-scheme: light)').matches;
        if (s === 'light' || (!s && p)) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (_) {}

      function syncButtons() {
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        document.querySelectorAll('[data-theme-toggle]').forEach((btn) => {
          btn.setAttribute('aria-label', isLight ? 'Switch to dark theme' : 'Switch to light theme');
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', syncButtons);
      } else {
        syncButtons();
      }

      document.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-theme-toggle]');
        if (!btn) return;
        e.preventDefault();
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        const next = isLight ? 'dark' : 'light';
        if (next === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        try {
          localStorage.setItem('n5hq-theme', next);
        } catch (_) {}
        syncButtons();
      });

      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const compact = matchMedia('(max-width: 820px)').matches;
      const navigation = performance.getEntriesByType?.('navigation')?.[0];
      const restored = navigation?.type === 'back_forward';
      if (reduced || compact || restored || location.hash) return;
      document.documentElement.classList.add('curtain-pending');
      window.__faultlineCurtainFallback = setTimeout(() => {
        document.documentElement.classList.remove('curtain-pending', 'curtain-running');
        if (typeof window.startFallbackTerrain === 'function') {
          window.startFallbackTerrain();
        }
      }, 4000);
      window.addEventListener('pageshow', (event) => {
        if (event.persisted) {
          clearTimeout(window.__faultlineCurtainFallback);
          document.documentElement.classList.remove('curtain-pending', 'curtain-running');
        }
      });
    })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css?v=1.3.5">
  <link rel="stylesheet" href="assets/logo/logo-motion.css?v=1.3.4">
  <script defer src="assets/logo/logo-motion.js?v=1.3.4"></script>
</head>
<body>
  <canvas id="terrain" aria-hidden="true"></canvas>
  <div id="terrain-stage" hidden aria-hidden="true">
    <canvas id="terrain-webgl"></canvas>
    <canvas id="terrain-overlay"></canvas>
  </div>

  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <defs>
      <symbol id="terrain-poster" viewBox="0 0 760 260">
        <g fill="none" stroke="currentColor" stroke-width="1.2">
          <path d="M0 212 48 178l42 18 55-47 49 26 54-103 49 62 45-38 46 44 56-126 58 94 51-47 54 80 54-39 59 62" opacity=".28"/>
          <path d="M0 225 48 191l42 18 55-47 49 26 54-103 49 62 45-38 46 44 56-126 58 94 51-47 54 80 54-39 59 62"/>
          <path d="M48 191v41M90 209v29M145 162v75M194 188v52M248 85v155M297 147v94M342 109v133M388 153v90M444 27v217M502 121v124M553 74v172M607 154v93M661 115v133" opacity=".62"/>
          <path d="M0 225 380 258 760 225" opacity=".16"/>
        </g>
      </symbol>
    </defs>
  </svg>

  <header class="site-header">
    <a class="eri-cli-logo" href="/" aria-label="N5HQ home" style="--logo-size: clamp(110px, 8.4vw, 145px);"><img src="assets/logo/logo-static.svg" alt="" width="145" height="145"></a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="mailto:helloworld@n5hq.me">EMAIL</a>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle color theme"><svg class="theme-toggle-svg" width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"><rect x="1.5" y="1.5" width="13" height="13" stroke="currentColor" stroke-width="1.2"/><path d="M8 1.5H14.5V14.5H8Z" fill="currentColor"/></svg></button>
    </nav>
  </header>

  <main>
    <section class="page" id="proof" aria-labelledby="home-title">
      <svg class="mobile-poster" viewBox="0 0 760 260" preserveAspectRatio="none" aria-hidden="true"><use href="#terrain-poster"/></svg>
      <div class="region hero">
        <h1 class="headline" id="home-title">N5HQ</h1>
        <p class="subtext"><a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">Coming soon.</a></p>
      </div>
    </section>
  </main>

  <script src="./assets/js/home.js?v=1.3.1"></script>
</body>
</html>
